name: Build demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-editor-demo
          path: dist
          retention-days: 7
